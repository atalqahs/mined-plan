name: Windows desktop (portable)

# Builds the portable Windows x64 app, tests the PACKAGED app on a real Windows machine
# (unpacked build + the real single-file portable .exe), and uploads the tested build.
# Run manually with "publish" to also attach it to a GitHub release.

on:
  push:
    branches: [claude/wonderful-hypatia-v09ayv, main]
    paths: ['desktop/**', 'src/**', 'tests/**', 'electron-builder.yml', 'package.json', 'package-lock.json', 'playwright.desktop.config.ts', 'docs/DESKTOP*', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the tested build to a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # GitHub's Windows machines have no GPU: use Chromium's software WebGL for the scene.
      DESKTOP_TEST_GL: '--use-angle=swiftshader --enable-unsafe-swiftshader'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check + unit tests
        run: |
          npx tsc -b
          npx tsc -p desktop --noEmit
          npm test

      - name: Build app (1.0.0) — unpacked + portable .exe
        run: |
          npm run build:desktop
          npx electron-builder --win dir portable --x64 --publish never
      - name: Build a newer version (1.0.1) for the update tests
        shell: bash # PowerShell mangles electron-builder's -c.<key>=<value> options
        run: npx electron-builder --win dir portable --x64 --publish never -c.extraMetadata.version=1.0.1 -c.directories.output=release-next

      - name: Packaged-app tests on Windows
        shell: bash
        run: npx playwright test --config playwright.desktop.config.ts --trace off
        env:
          DESKTOP_APP_DIR: release/win-unpacked
          DESKTOP_APP_DIR_NEXT: release-next/win-unpacked
          PORTABLE_EXE: release/ORBITAL MIND.exe
          PORTABLE_EXE_NEXT: release-next/ORBITAL MIND.exe

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-diagnostics
          path: |
            test-results
            .desktop-test/**/Data/logs
            .desktop-test-portable/**/Data/logs
          retention-days: 14

      - name: Package the portable folder
        shell: pwsh
        run: |
          $dir = "portable/ORBITAL MIND"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "release/ORBITAL MIND.exe" $dir
          Copy-Item "docs/DESKTOP_GUIDE_AR.txt" "$dir/دليل الاستخدام.txt"
          Push-Location portable
          7z a -tzip "../ORBITAL-MIND-Portable-win-x64.zip" "ORBITAL MIND" | Out-Null
          Pop-Location
          Get-FileHash "release/ORBITAL MIND.exe","ORBITAL-MIND-Portable-win-x64.zip" -Algorithm SHA256 | Format-List

      - name: Upload the tested portable build
        uses: actions/upload-artifact@v4
        with:
          name: ORBITAL-MIND-Portable-win-x64
          path: portable
          retention-days: 90

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $notes = "ORBITAL MIND (مِدار) — Windows x64 portable build $version. Tested on windows-latest by the 'Windows desktop (portable)' workflow (run ${{ github.run_id }}). See docs/DESKTOP.md."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "ORBITAL-MIND-Portable-win-x64.zip" --target "${{ github.sha }}" --title "ORBITAL MIND $version — Windows portable" --notes $notes
          } else {
            gh release upload $tag "ORBITAL-MIND-Portable-win-x64.zip" --clobber
          }
